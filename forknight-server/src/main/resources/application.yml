server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/forknight
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

app:
  jwt:
    secret: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000

logging:
  level:
    com.forknight: DEBUG
